{% extends 'main/pattern.html' %}

{% block title %}Registration{% endblock %}

{% block content %}
<h2 class="auth">Registration</h2>

<form class="form-register" method="POST" novalidate>
  {% csrf_token %}

  {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    </div>
  {% endfor %}

  <button type="submit" class="sub">Register</button>
</form>

<p class="log-url">
  Already have an account?
  <a href="{% url 'login' %}">Login</a>
</p>
{% endblock %}
