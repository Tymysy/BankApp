{% extends 'main/pattern.html' %}

{% block title %}Registration{% endblock %}

{% block content %}
<h2 class="auth">Registration</h2>

<form method="POST" novalidate>
  {% csrf_token %}

   <div class="form-grid">
    {% for field in form %}
      <div class="form-field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
      </div>
    {% endfor %}
  </div>

  <button type="submit" class="sub">Register</button>

  <p class="log-url">
    Already have an account?
    <a class="urls-auth" href="{% url 'login' %}">Login</a>
  </p>
</form>
{% endblock %}
