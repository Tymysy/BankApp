{% extends 'main/pattern.html' %}

{% block title %}Authorization{% endblock %}

{% block content %}

<h2>Authorization</h2>
<form class="log-in" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="sub">Login</button>
    <a href="{% url 'register' %}">Registration</a>
</form>

{% endblock %}
